name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP syntax
        run: |
          find dsi-magazine mu-plugins -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Validate .htaccess syntax
        run: |
          cat > /tmp/httpd-test.conf <<'EOF'
          ServerName localhost
          Listen 8080
          DocumentRoot "/usr/local/apache2/htdocs"
          <Directory "/usr/local/apache2/htdocs">
              AllowOverride All
              Require all granted
          </Directory>
          ErrorLog /proc/self/fd/2
          LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
          LoadModule rewrite_module modules/mod_rewrite.so
          LoadModule headers_module modules/mod_headers.so
          LoadModule mime_module modules/mod_mime.so
          LoadModule authz_core_module modules/mod_authz_core.so
          LoadModule authz_host_module modules/mod_authz_host.so
          LoadModule access_compat_module modules/mod_access_compat.so
          LoadModule unixd_module modules/mod_unixd.so
          LoadModule dir_module modules/mod_dir.so
          LoadModule log_config_module modules/mod_log_config.so
          EOF
          docker run -d --name htaccess-test -p 8080:8080 \
            -v $(pwd)/.htaccess:/usr/local/apache2/htdocs/.htaccess:ro \
            -v /tmp/httpd-test.conf:/usr/local/apache2/conf/httpd.conf:ro \
            httpd:2.4
          sleep 3
          docker logs htaccess-test > /tmp/htaccess-logs.txt 2>&1
          cat /tmp/htaccess-logs.txt
          if grep -qiE "Invalid command|Syntax error|AH00526|could not be configured" /tmp/htaccess-logs.txt; then
            echo "ERRO: .htaccess com sintaxe invalida — bloqueando deploy"
            docker stop htaccess-test || true
            exit 1
          fi
          if ! curl -sf http://localhost:8080/ -o /dev/null; then
            echo "ERRO: requisicao de teste falhou com o .htaccess atual — bloqueando deploy"
            docker logs htaccess-test
            docker stop htaccess-test || true
            exit 1
          fi
          docker stop htaccess-test

      - name: Fix title encoding
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          cat > /tmp/fix-encoding-runner.php <<'PHPEOF'
          <?php
          putenv('DB_USER=' . getenv('DB_USER'));
          putenv('DB_PASS=' . getenv('DB_PASS'));
          include 'scripts/fix-encoding.php';
          PHPEOF
          curl --user "$FTP_USER:$FTP_PASS" -Q "CWD /" -T /tmp/fix-encoding-runner.php "ftp://45.151.121.68/fix-encoding-runner.php"
          curl -s https://deveserisso.com.br/fix-encoding-runner.php
          curl --user "$FTP_USER:$FTP_PASS" -Q "CWD /" -X "DELE fix-encoding-runner.php" "ftp://45.151.121.68/" || true

      - name: Deploy .htaccess, purge script, llms.txt, robots.txt, api-catalog (gateado por validação)
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          curl --user "$FTP_USER:$FTP_PASS" -Q "CWD /" -T .htaccess "ftp://45.151.121.68/.htaccess"
          curl --user "$FTP_USER:$FTP_PASS" -Q "CWD /" -T purge_ls.php "ftp://45.151.121.68/purge_ls.php"
          curl --user "$FTP_USER:$FTP_PASS" -Q "CWD /" -T llms.txt "ftp://45.151.121.68/llms.txt"
          curl --user "$FTP_USER:$FTP_PASS" -Q "CWD /" -T robots.txt "ftp://45.151.121.68/robots.txt"
          curl --user "$FTP_USER:$FTP_PASS" -Q "CWD /" --ftp-create-dirs -T ".well-known/api-catalog" "ftp://45.151.121.68/.well-known/api-catalog"
          curl --user "$FTP_USER:$FTP_PASS" -Q "CWD /" -T openapi.json "ftp://45.151.121.68/openapi.json"

      - name: Deploy to staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 45.151.121.68
          protocol: ftp
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /staging/wp-content/themes/dsi-magazine/
          local-dir: ./dsi-magazine/

      - name: Deploy mu-plugins to staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 45.151.121.68
          protocol: ftp
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /staging/wp-content/mu-plugins/
          local-dir: ./mu-plugins/

      - name: Test critical URLs on staging
        run: |
          curl -sI https://staging.deveserisso.com.br/ | grep "200"
          curl -sI https://staging.deveserisso.com.br/privacidade | grep "301"

      - name: FTP Deploy (produção)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 45.151.121.68
          protocol: ftp
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /blog/wp-content/themes/dsi-magazine/
          local-dir: ./dsi-magazine/

      - name: Deploy mu-plugins (produção)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 45.151.121.68
          protocol: ftp
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /blog/wp-content/mu-plugins/
          local-dir: ./mu-plugins/

      - name: Purge cache
        run: curl -s https://deveserisso.com.br/purge_ls.php

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Post-deploy healthcheck
        run: |
          # A propagacao entre as 3 camadas de cache (LiteSpeed -> hcdn ->
          # Cloudflare) as vezes passa de 45s. Em vez de um sleep fixo (ja
          # causou falso-negativo com 20s e com 45s), tenta cada checagem
          # varias vezes antes de falhar de verdade.
          check() {
            local desc="$1"; local cmd="$2"; local pattern="$3"
            for i in 1 2 3 4 5 6; do
              if eval "$cmd" | grep -qi "$pattern"; then
                echo "OK: $desc"
                return 0
              fi
              sleep 10
            done
            echo "FALHOU apos 6 tentativas: $desc"
            return 1
          }

          check "home 200" 'curl -sI https://deveserisso.com.br/' "200"
          check "privacidade redirect 301" 'curl -sI https://deveserisso.com.br/privacidade' "301"
          check "blog/ redirect 301" 'curl -sI https://deveserisso.com.br/blog/' "301"
          check "WebP negotiation" 'curl -sI -H "Accept: image/webp" "https://deveserisso.com.br/blog/wp-content/uploads/2021/02/logo-dsi_laranja_bc-96x96.png"' "image/webp"
          check "sufixo .md" 'curl -sI https://deveserisso.com.br/politicas-de-privacidade.md' "text/markdown"
          check "HTML normal sem .md" 'curl -sI https://deveserisso.com.br/politicas-de-privacidade/' "text/html"

          # trust anchor pages (item 4) e pagina de desenvolvedores/MCP (item 5)
          check "/sobre/ 200" 'curl -sI https://deveserisso.com.br/sobre/' "200"
          check "/contato/ 200" 'curl -sI https://deveserisso.com.br/contato/' "200"
          check "/desenvolvedores/ 200" 'curl -sI https://deveserisso.com.br/desenvolvedores/' "200"
          check "/quem-somos/ redirect 301" 'curl -sI https://deveserisso.com.br/quem-somos/' "301"

          # Content Signals no robots.txt, Link header (RFC 8288) e API Catalog (RFC 9727)
          check "Content-Signal no robots.txt" 'curl -s https://deveserisso.com.br/robots.txt' "Content-Signal"
          check "Link rel=llms.txt" 'curl -sI https://deveserisso.com.br/' 'rel="llms.txt"'
          check "Link rel=api-catalog" 'curl -sI https://deveserisso.com.br/' 'rel="api-catalog"'
          check "api-catalog 200" 'curl -sI https://deveserisso.com.br/.well-known/api-catalog' "200"
          check "api-catalog content-type" 'curl -sI https://deveserisso.com.br/.well-known/api-catalog' "application/linkset"
          check "openapi.json 200" 'curl -sI https://deveserisso.com.br/openapi.json' "200"
          check "openapi.json conteudo" 'curl -s https://deveserisso.com.br/openapi.json' '"openapi"'
          check "erro JSON estruturado da API" 'curl -s "https://deveserisso.com.br/wp-json/webmcp/v1/tools/search"' '"code"'
